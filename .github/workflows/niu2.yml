name: NIU charge alert

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niu-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      THRESHOLD: "80"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install niu-cloud-cli
        run: |
          git clone --recursive https://github.com/BlueAndi/niu-cloud-cli.git cli
          cd cli && npm install --no-audit --no-fund

      - name: Read battery state
        env:
          NIU_ACCOUNT: ${{ secrets.NIU_ACCOUNT }}
          NIU_PASSWORD: ${{ secrets.NIU_PASSWORD }}
          NIU_SN: ${{ secrets.NIU_SN }}
        run: |
          cd cli
          node niu-cloud-cli.js create-token "$NIU_ACCOUNT" "$NIU_PASSWORD" 33 --tokenFile token.json > /dev/null
          node niu-cloud-cli.js get-battery-info --tokenFile token.json --sn "$NIU_SN" --json > info.json
          python3 -c "import json;d=json.load(open('info.json'));b=d['batteries'];print(d['isCharging'],b['compartmentA']['batteryCharging'],b['compartmentB']['batteryCharging'])" > ../reading.txt

      - name: Decide
        id: decide
        run: |
          read CHG A B < reading.txt
          MIN=$(( A < B ? A : B ))
          PREV=$(cat state.txt 2>/dev/null || echo idle)
          echo "Lecture : isCharging=$CHG | A=${A}% | B=${B}% | min=${MIN}% | seuil=${THRESHOLD}% | état précédent=$PREV"
          CUT=false
          NOTIFY=false
          if [ "$CHG" != "1" ]; then
            NEW=idle
            REASON="pas en charge (isCharging=$CHG)"
          elif [ "$MIN" -lt "$THRESHOLD" ]; then
            NEW=idle
            REASON="en charge mais sous le seuil (${MIN}% < ${THRESHOLD}%)"
          else
            NEW=notified
            CUT=true
            REASON="en charge et seuil atteint (${MIN}% >= ${THRESHOLD}%)"
            if [ "$PREV" != "notified" ]; then
              NOTIFY=true
            fi
          fi
          echo "Décision : couper=$CUT | notifier=$NOTIFY | raison : $REASON"
          echo "$NEW" > state.txt
          {
            echo "cut=$CUT"
            echo "notify=$NOTIFY"
            echo "a=$A"
            echo "b=$B"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Couper la prise
        id: cut
        if: steps.decide.outputs.cut == 'true'
        continue-on-error: true
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
        run: |
          pip install tinytuya
          python prise.py off

      - name: Notify
        if: steps.decide.outputs.notify == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_NIU }}
          A: ${{ steps.decide.outputs.a }}
          B: ${{ steps.decide.outputs.b }}
          CUT_OK: ${{ steps.cut.outcome }}
        run: |
          if [ "$CUT_OK" = "success" ]; then
            MSG="Batteries à ${A}% et ${B}%, prise coupée"
          else
            MSG="Batteries à ${A}% et ${B}%, pense à débrancher (coupure auto échouée)"
          fi
          curl -sS -H "Title: Scooter NIU" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null

      - name: Résumé
        if: always()
        env:
          CUT: ${{ steps.decide.outputs.cut }}
          RESULT: ${{ steps.cut.outcome }}
          A: ${{ steps.decide.outputs.a }}
          B: ${{ steps.decide.outputs.b }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          if [ "$CUT" != "true" ]; then
            LINE="Batteries ${A}% / ${B}% : pas de coupure, $REASON"
          elif [ "$RESULT" = "success" ]; then
            LINE="Batteries ${A}% / ${B}% : prise COUPÉE avec succès"
          else
            LINE="Batteries ${A}% / ${B}% : coupure ÉCHOUÉE (retentée au prochain passage)"
          fi
          echo "$LINE"
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.txt
          git diff --cached --quiet || (git commit -m "state" && git push)
